name: Build and Release Patched TickTick

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Direct URL to your original TickTick.exe file"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download TickTick Setup
        shell: pwsh
        run: |
          $targetPath = "TickTick.exe"
          $inputUrl = "${{ inputs.app_url }}"

          function Test-PortableExecutable([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              return $false
            }

            $stream = [System.IO.File]::OpenRead($Path)
            try {
              if ($stream.Length -lt 2) {
                return $false
              }

              return $stream.ReadByte() -eq 0x4D -and $stream.ReadByte() -eq 0x5A
            }
            finally {
              $stream.Dispose()
            }
          }

          $candidateUrls = @($inputUrl)
          if ($inputUrl -notmatch '[?&]download=1(?:&|$)') {
            if ($inputUrl.Contains('?')) {
              $candidateUrls += "$inputUrl&download=1"
            }
            else {
              $candidateUrls += "$inputUrl?download=1"
            }
          }

          $downloaded = $false
          foreach ($candidateUrl in ($candidateUrls | Select-Object -Unique)) {
            Write-Host "Downloading target file from $candidateUrl..."
            if (Test-Path -LiteralPath $targetPath) {
              Remove-Item -LiteralPath $targetPath -Force
            }

            try {
              Invoke-WebRequest -Uri $candidateUrl -OutFile $targetPath
            }
            catch {
              Write-Warning "Download attempt failed: $($_.Exception.Message)"
              continue
            }

            if (Test-PortableExecutable $targetPath) {
              $downloaded = $true
              break
            }

            Write-Warning "Downloaded content is not a valid PE executable."
          }

          if (-not $downloaded) {
            Write-Error "Failed to download a valid TickTick executable. Use a direct download URL to the installed TickTick app binary (not an HTML page)."
            exit 1
          }

      - name: Run Patcher
        # We can just build and run directly via dotnet run
        run: dotnet run -- "TickTick.exe"

      - name: Prepare Release Package
        shell: pwsh
        run: |
          if (-not (Test-Path "TickTick_Patched.exe")) {
            Write-Error "Patching failed: TickTick_Patched.exe not generated."
            exit 1
          }
          Compress-Archive -Path "TickTick_Patched.exe" -DestinationPath "TickTick_Patched.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Patched TickTick (${{ github.run_number }})
          files: TickTick_Patched.zip
          draft: true

      - name: Output Release URL
        shell: pwsh
        run: |
          Write-Host "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
